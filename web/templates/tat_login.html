<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trusted Auth Token IdP - Tokenator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 440px;
            padding: 40px;
        }
        .logo { text-align: center; margin-bottom: 24px; }
        .logo h1 { color: #667eea; font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        .logo p { color: #6b7280; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; color: #374151; font-weight: 500; margin-bottom: 8px; font-size: 14px; }
        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
        }
        input[type="text"]:focus, input[type="email"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .info-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 12px;
            margin-top: 20px;
            font-size: 13px;
            color: #1e40af;
            word-break: break-all;
        }
        .info-box strong { display: block; margin-bottom: 4px; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🔐 tokenator TAT IdP</h1>
            <p>Mock Trusted Auth Token issuer (HelloIDP stand-in)</p>
        </div>

        <form method="POST" action="">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Ada Lovelace" required autofocus>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="ada@example.com" required>
            </div>
            {{range .Passthrough}}<input type="hidden" name="{{.Key}}" value="{{.Value}}">
            {{end}}
            <button type="submit" class="btn-login">Continue</button>
        </form>

        <div class="info-box">
            <strong>Signs in to:</strong>
            {{.CallbackURL}}
        </div>
    </div>
</body>
</html>
