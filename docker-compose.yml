services:
  as:
    build: .
    image: tokenator-as:latest
    container_name: tokenator-as
    command: ["/bin/as"]
    environment:
      - ISSUER=http://localhost:8080
      - RS_AUDIENCE=http://localhost:9090
      - AS_ADMIN_TOKEN=
      - ALLOW_LEGACY_HARDCODED=false
      # Identities live in memory and are lost on restart, so seed known demo
      # humans (and their passwords) on every boot.
      - SEED_IDENTITIES_JSON=/seed/identities.json
      - AS_CLIENTS_DB=/data/clients.db
      - AS_ADMIN_ADDR=127.0.0.1:8082
      - AS_SIGNING_KEY_BASE64=ZGV2LXNpZ25pbmcta2V5LTEyMzQ=
      - AS_SIGNING_KEY_ID=dev-rs256
      # Federated sign-in. Values come from .env (gitignored) via compose
      # interpolation; leaving them unset simply disables the feature.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8080}
      - UPSTREAM_ISSUER=${UPSTREAM_ISSUER:-}
      - UPSTREAM_CLIENT_ID=${UPSTREAM_CLIENT_ID:-}
      - UPSTREAM_CLIENT_SECRET=${UPSTREAM_CLIENT_SECRET:-}
      - UPSTREAM_SCOPES=${UPSTREAM_SCOPES:-openid,email,profile}
      - UPSTREAM_DISPLAY_NAME=${UPSTREAM_DISPLAY_NAME:-Google}
      # TAT IdP mode. Unset TAT_TENANT_HOST leaves /tat/* disabled (412).
      - TAT_ISSUER=${TAT_ISSUER:-}
      - TAT_TENANT_HOST=${TAT_TENANT_HOST:-}
      - TAT_TOKEN_TTL_SECONDS=${TAT_TOKEN_TTL_SECONDS:-300}
    volumes:
      - ./data:/data
      - ./seed:/seed:ro
    ports:
      - "8080:8080"
  rs:
    image: tokenator-as:latest
    container_name: tokenator-rs
    command: ["/bin/rs"]
    environment:
      - RS_AUDIENCE=http://localhost:9090
      - AS_ISSUER=http://localhost:8080
    ports:
      - "9090:9090"
    depends_on:
      - as
  oauth-client:
    build:
      context: ./examples/oauth-client
      dockerfile: Dockerfile
    image: tokenator-oauth-client:latest
    container_name: tokenator-oauth-client
    environment:
      - AUTH_URL=http://as:8080/oauth2/authorize
      - TOKEN_URL=http://as:8080/oauth2/token
      - RS_URL=http://rs:9090
    ports:
      - "5555:5555"
    depends_on:
      - as
      - rs
