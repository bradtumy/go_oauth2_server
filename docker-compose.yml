services:
  as:
    build: .
    image: tokenator-as:latest
    container_name: tokenator-as
    command: ["/bin/as"]
    environment:
      - ISSUER=http://localhost:8080
      - RS_AUDIENCE=http://localhost:9090
      - AS_ADMIN_TOKEN=
      - ALLOW_LEGACY_HARDCODED=false
      # Identities live in memory and are lost on restart, so seed known demo
      # humans (and their passwords) on every boot.
      - SEED_IDENTITIES_JSON=/seed/identities.json
      - AS_CLIENTS_DB=/data/clients.db
      - AS_ADMIN_ADDR=127.0.0.1:8082
      # AS_SIGNING_KEY_PATH is what the server actually reads. Without it the
      # server falls back to the default key committed in internal/config,
      # which is public: anyone with the source could forge tokens this
      # deployment would accept.
      - AS_SIGNING_KEY_PATH=/keys/tat-signing-key.pem
      - AS_SIGNING_KEY_ID=dev-rs256
      # Federated sign-in. Values come from .env (gitignored) via compose
      # interpolation; leaving them unset simply disables the feature.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8080}
      - UPSTREAM_ISSUER=${UPSTREAM_ISSUER:-}
      - UPSTREAM_CLIENT_ID=${UPSTREAM_CLIENT_ID:-}
      - UPSTREAM_CLIENT_SECRET=${UPSTREAM_CLIENT_SECRET:-}
      - UPSTREAM_SCOPES=${UPSTREAM_SCOPES:-openid,email,profile}
      - UPSTREAM_DISPLAY_NAME=${UPSTREAM_DISPLAY_NAME:-Google}
      # TAT IdP mode. Unset TAT_TENANT_HOST leaves /tat/* disabled (412).
      - TAT_ISSUER=${TAT_ISSUER:-}
      - TAT_AUDIENCE=${TAT_AUDIENCE:-}
      - TAT_TENANT_HOST=${TAT_TENANT_HOST:-}
      - TAT_TOKEN_TTL_SECONDS=${TAT_TOKEN_TTL_SECONDS:-300}
      - TAT_SCOPES=${TAT_SCOPES:-openid profile email}
      - TAT_AUTHORIZATION_DETAILS_TYPES=${TAT_AUTHORIZATION_DETAILS_TYPES:-}
    volumes:
      - ./data:/data
      - ./seed:/seed:ro
      - ./keys:/keys:ro
    ports:
      - "8080:8080"
  rs:
    image: tokenator-as:latest
    container_name: tokenator-rs
    command: ["/bin/rs"]
    environment:
      - RS_AUDIENCE=http://localhost:9090
      - AS_ISSUER=http://localhost:8080
      # The resource server verifies what the authorization server signs, so it
      # must load the same key.
      - AS_SIGNING_KEY_PATH=/keys/tat-signing-key.pem
      - AS_SIGNING_KEY_ID=dev-rs256
    volumes:
      - ./keys:/keys:ro
    ports:
      - "9090:9090"
    depends_on:
      - as
  oauth-client:
    build:
      context: ./examples/oauth-client
      dockerfile: Dockerfile
    image: tokenator-oauth-client:latest
    container_name: tokenator-oauth-client
    environment:
      - AUTH_URL=http://as:8080/oauth2/authorize
      - TOKEN_URL=http://as:8080/oauth2/token
      - RS_URL=http://rs:9090
    ports:
      - "5555:5555"
    depends_on:
      - as
      - rs

  # A second instance of the same example client, pointed at Twilio's Agent
  # Identity authorization server instead of tokenator, for driving the flow
  # before a real agent exists. Opt in with:
  #   docker compose --profile agent up -d agent-client
  # Left out of the default `up` so the tokenator demo on 5555 is untouched.
  agent-client:
    profiles: ["agent"]
    image: tokenator-oauth-client:latest
    container_name: tokenator-agent-client
    environment:
      - CLIENT_ID=${AGENT_CLIENT_ID:-}
      # Leave AGENT_CLIENT_SECRET empty for a public client using PKCE.
      - CLIENT_SECRET=${AGENT_CLIENT_SECRET:-}
      - AUTH_URL=${AGENT_AUTH_URL:-}
      - TOKEN_URL=${AGENT_TOKEN_URL:-}
      - REDIRECT_URI=${AGENT_REDIRECT_URI:-http://localhost:8090/callback}
      - SCOPE=${AGENT_SCOPE:-openid profile email}
      # No tokenator resource server in this flow; the protected-API call is
      # skipped rather than failing.
      - RS_URL=${AGENT_RS_URL:-}
    ports:
      - "8090:5555"
